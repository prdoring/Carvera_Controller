name: Kiosk release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing mainline kiosk-vX.Y.Z.devN tag
        required: true
        type: string
      mode:
        required: true
        type: choice
        options: [full, app-only]
      publish:
        description: Publish after the documented native desktop and Pi validation gates
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kiosk-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  resolve:
    if: github.ref == 'refs/heads/main' && github.repository == 'prdoring/Carvera_Controller'
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
      prerelease: ${{ steps.source.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve immutable source and reject existing releases
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_MODE: ${{ inputs.mode }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/kiosk_publication.py prepare --tag "$RELEASE_TAG" --mode "$RELEASE_MODE" > "$RUNNER_TEMP/source.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          source = json.loads((Path(os.environ['RUNNER_TEMP']) / 'source.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for key in ('commit', 'version', 'prerelease'):
                  print(key + '=' + str(source[key]).lower(), file=out)
          PY

  components:
    needs: resolve
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build isolated regression environment
        run: docker build --memory 3g --cpu-quota 200000 -t kiosk-checks -f assets/packaging/kiosk/Dockerfile.test .
      - name: Run kiosk and shared regressions
        run: docker run --rm --init --memory 3g --cpus 2 --network none kiosk-checks
      - name: Render the independent first-boot failure screen
        run: |
          mkdir -p dist/kiosk/system-ui-reports
          docker run --rm --init --memory 2g --cpus 2 --network none \
            -e CARVERA_BOOT_REPORTS=/reports \
            --mount "type=bind,source=$PWD/dist/kiosk/system-ui-reports,target=/reports" \
            kiosk-checks xvfb-run -a -s '-screen 0 1920x1200x24 -nolisten tcp' python tests/boot/kiosk_setup_ui.py
      - uses: actions/upload-artifact@v4
        with:
          name: kiosk-system-ui-checks
          path: dist/kiosk/system-ui-reports/*
      - name: Build component artifacts from the resolved commit
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          if [ "$RELEASE_MODE" = full ]; then
            python scripts/kiosk.py build --version "$RELEASE_VERSION"
          else
            python scripts/kiosk.py build --version "$RELEASE_VERSION" --app-only
          fi
      - name: Verify application bundle identities
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python -m pip install packaging==26.3
          python -m scripts.kiosk_release verify "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: kiosk-components
          if-no-files-found: error
          path: |
            dist/kiosk/carvera-kiosk-*.img.xz
            dist/kiosk/carvera-kiosk-*.tar.gz
            dist/kiosk/carvera-kiosk-*.tar.gz.sha256
            dist/kiosk/carvera-kiosk-laptop-*.zip
            dist/kiosk/bundle*.json
            dist/kiosk/image-metadata.json

  linux-desktop:
    needs: resolve
    if: inputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch verified presentation assets
        run: |
          python scripts/kiosk_desktop_assets.py dist/kiosk/desktop-assets/noto
          python scripts/kiosk_novnc.py dist/kiosk/novnc-desktop
      - name: Build native Debian 12 writer
        run: |
          docker build --memory 3g --cpu-quota 200000 -t kiosk-writer -f assets/packaging/kiosk/Dockerfile.writer .
          id=$(docker create kiosk-writer)
          trap 'docker rm "$id"' EXIT
          docker cp "$id:/writer" dist/kiosk/writer
      - name: Build independent Python 3.12 desktop runtime
        run: docker build --memory 3g --cpu-quota 200000 -t kiosk-desktop -f assets/packaging/kiosk/Dockerfile.desktop .
      - name: Freeze, package and exercise both tools
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          mkdir -p dist/kiosk/native
          docker run --rm --init --memory 3g --cpus 2 --network none \
            -e RELEASE_VERSION -e RELEASE_COMMIT \
            --mount "type=bind,source=$PWD,target=/src,readonly" \
            --mount "type=bind,source=$PWD/dist/kiosk/native,target=/output" kiosk-desktop \
            python scripts/kiosk_desktop_check.py --output /output --writer /src/dist/kiosk/writer
      - name: Check installed and portable packages without development tools
        run: |
          docker build --memory 1g -t kiosk-desktop-clean -f assets/packaging/kiosk/Dockerfile.desktop-clean .
          docker run --rm --init --memory 1g --cpus 2 --network none \
            --mount "type=bind,source=$PWD/dist/kiosk/native,target=/packages,readonly" kiosk-desktop-clean
      - uses: actions/upload-artifact@v4
        with:
          name: kiosk-desktop-linux-${{ matrix.arch }}
          if-no-files-found: error
          path: dist/kiosk/native/packages/*
      - uses: actions/upload-artifact@v4
        with:
          name: kiosk-design-linux-${{ matrix.arch }}
          path: dist/kiosk/native/reports/*
      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'x64'
        with:
          name: kiosk-writer-ci
          if-no-files-found: error
          path: dist/kiosk/writer/**

  windows-desktop:
    needs: resolve
    if: inputs.mode == 'full'
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install isolated desktop and native writer build dependencies
        run: |
          python -m pip install -r assets/packaging/kiosk/desktop-requirements.txt pytest==8.4.2 pytest-timeout==2.4.0 aqtinstall==3.3.0 cmake==3.31.6 ninja==1.11.1.4
          $qtOutput=Join-Path $env:GITHUB_WORKSPACE 'dist/kiosk/qt'
          Push-Location $env:RUNNER_TEMP
          try {
            python -m aqt install-qt windows desktop 6.9.3 win64_mingw --archives qtbase qttools --outputdir $qtOutput
            if ($LASTEXITCODE) { throw 'Qt download failed' }
            python -m aqt install-tool windows desktop tools_mingw1310 qt.tools.win64_mingw1310 --outputdir $qtOutput
            if ($LASTEXITCODE) { throw 'Compiler download failed' }
          } finally { Pop-Location }
          $compiler=python scripts/kiosk_nsis.py dist/kiosk/nsis
          "CARVERA_NSIS_COMPILER=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build pinned Windows writer and fetch presentation
        shell: pwsh
        run: |
          $qt=(Resolve-Path dist/kiosk/qt/6.9.3/mingw_64).Path
          $compiler=(Resolve-Path dist/kiosk/qt/Tools/mingw1310_64/bin).Path
          $env:PATH=$compiler+';'+$qt+'/bin;'+$env:PATH
          python scripts/build_kiosk_writer.py --qt $qt --work dist/kiosk/writer-work --output dist/kiosk/writer
          python scripts/kiosk_desktop_assets.py dist/kiosk/desktop-assets/noto
          python scripts/kiosk_novnc.py dist/kiosk/novnc-desktop
      - name: Freeze, package and exercise both Windows tools
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: python scripts/kiosk_desktop_check.py --output dist/kiosk/native --writer dist/kiosk/writer
      - uses: actions/upload-artifact@v4
        with:
          name: kiosk-desktop-windows-x64
          if-no-files-found: error
          path: dist/kiosk/native/packages/*
      - uses: actions/upload-artifact@v4
        with:
          name: kiosk-design-windows-x64
          path: dist/kiosk/native/reports/*

  boot:
    needs: [resolve, linux-desktop]
    if: inputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: kiosk-writer-ci
          path: dist/kiosk/ci-writer
      - name: Exercise Debian 13 systemd boot, provisioning and growth
        run: |
          docker build --memory 3g --cpu-quota 200000 -t kiosk-boot -f assets/packaging/kiosk/Dockerfile.boot-test .
          docker run --rm --init --memory 2g --cpus 2 --network none --mount "type=bind,source=$PWD,target=/src,readonly" kiosk-boot
          docker run --rm --init --memory 2g --cpus 2 --network none --mount "type=bind,source=$PWD,target=/src,readonly" kiosk-boot python3 tests/boot/kiosk_setup_boot.py
          docker run --rm --init --memory 2g --cpus 2 --network none --mount "type=bind,source=$PWD,target=/src,readonly" kiosk-boot python3 tests/boot/kiosk_writer_boot.py --writer /src/dist/kiosk/ci-writer

  publish:
    needs: [resolve, components, linux-desktop, windows-desktop, boot]
    if: >-
      always() && needs.resolve.result == 'success' && needs.components.result == 'success' &&
      (inputs.mode == 'app-only' || (needs.linux-desktop.result == 'success' && needs.windows-desktop.result == 'success' && needs.boot.result == 'success'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: kiosk-components
          path: incoming
      - uses: actions/download-artifact@v4
        if: inputs.mode == 'full'
        with:
          pattern: kiosk-desktop-*
          merge-multiple: true
          path: incoming
      - name: Assemble exact inventory and verify embedded identities
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full
          python -m pip install packaging==26.3
          python scripts/kiosk_release_stage.py --incoming incoming --output release --mode "$RELEASE_MODE" --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT"
      - name: Recheck source and create a complete draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
          RELEASE_PREVIEW: ${{ needs.resolve.outputs.prerelease }}
          PUBLISH_RELEASE: ${{ inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/kiosk_publication.py recheck --tag "$RELEASE_TAG" --mode "$RELEASE_MODE" --commit "$RELEASE_COMMIT"
          flags=()
          if [ "$RELEASE_PREVIEW" = true ]; then flags+=(--prerelease); fi
          printf '%s\n' "Kiosk $RELEASE_MODE release from $RELEASE_COMMIT." \
            'See README setup instructions. Windows desktop downloads are unsigned prereleases.' \
            'Full images include Setup, Screen Share and separate controller/System/updater tools. App-only releases do not install a new card.' > "$RUNNER_TEMP/notes.md"
          gh release create "$RELEASE_TAG" --verify-tag --draft "${flags[@]}" --title "Kiosk ${RELEASE_TAG#kiosk-v}" --notes-file "$RUNNER_TEMP/notes.md"
          gh release upload "$RELEASE_TAG" release/*
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/downloaded"
          python scripts/kiosk_release_stage.py --compare release "$RUNNER_TEMP/downloaded"
          python - <<'PY'
          import os
          from scripts.kiosk_publication import recheck
          recheck(os.environ['RELEASE_TAG'], os.environ['RELEASE_COMMIT'], os.environ['RELEASE_MODE'])
          PY
          if [ "$PUBLISH_RELEASE" = true ]; then
            gh release edit "$RELEASE_TAG" --draft=false
          fi
