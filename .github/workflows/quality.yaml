name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - develop

jobs:
  python39:
    name: Python 3.9 protocol and geometry compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install Poetry and dependencies
        run: |
          python -m pip install poetry==2.1.3
          poetry config virtualenvs.in-project true
          poetry install --only main,test
      - name: Run protocol and geometry regressions
        run: |
          poetry run python -m pytest -q \
            tests/unit/test_protocol_framing.py \
            tests/unit/test_protocol_makera.py \
            tests/unit/test_protocol_smoothie.py \
            tests/unit/test_protocol_detector.py \
            tests/unit/test_cmm_import.py \
            tests/unit/test_machine_state_values.py

  quality:
    name: quality
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Poetry virtual environment
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-quality-py3.12-${{ hashFiles('poetry.lock') }}

      - name: Install poetry and dependencies
        uses: ./.github/actions/bootstrap-poetry
        with:
          os: linux
          install-args: --only main,lint,test

      - name: Install Linux prerequisites
        run: poetry run ./scripts/install_linux_prereqs.sh

      - name: Install Linux test prerequisites
        run: sudo apt-get install -y xvfb libgl1 libgles2 libmtdev1 python3-tk fontconfig

      - name: Run quality hooks
        run: poetry run pre-commit run --all-files

      - name: Run tests
        run: xvfb-run -a -s "-screen 0 1920x1080x24 -nolisten tcp" poetry run python -m pytest tests
